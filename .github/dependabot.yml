# zakura-common-ycash (2026-11-01): security updates only (.github/README-ycash.md). Version
# updates are off in every ecosystem (open-pull-requests-limit: 0): the fork's dependencies move
# with an upstream sync or a reviewed commit. Security updates (a separate limit) open once
# "Dependabot security updates" is enabled in Settings -> Code security.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    # Routine updates need matching cargo-vet evidence, so maintainers curate
    # them explicitly. Security updates remain enabled at repository level.
    versioning-strategy: auto
    schedule:
      interval: monthly
      timezone: America/New_York
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - rust
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      timezone: America/New_York
    cooldown:
      default-days: 7
    # zakura-common-ycash (2026-11-01): security updates only (was: 4 open version-update PRs).
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
  # The scanner image's base is pinned by digest (see .oss-scanner/Dockerfile);
  # this keeps the pin fresh without unpinning it.
  - package-ecosystem: docker
    directory: /.oss-scanner
    schedule:
      interval: weekly
      day: wednesday
      timezone: America/New_York
    cooldown:
      default-days: 7
    # zakura-common-ycash (2026-11-01): security updates only (was: 4 open version-update PRs).
    open-pull-requests-limit: 0
    labels:
      - dependencies
