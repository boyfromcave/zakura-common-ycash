name: Workflow security

on:
  pull_request:
    # zakura-common-ycash (2026-11-01): only PRs into the fork's branches (.github/README-ycash.md "Triggers").
    branches: [upgrade/vault, "vaults/**", "kc/**"]
    paths:
      - .github/**
  push:
    # zakura-common-ycash (2026-11-01): only pushes to the fork's branches; upstream's `main` dropped.
    branches:
      - upgrade/vault
      - "vaults/**"
    paths:
      - .github/**
  # zakura-common-ycash (2026-11-01): no merge queue on the fork, and nothing runs outside its
  # branches (.github/README-ycash.md "Triggers").
  # merge_group:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Imported libraries retain inert upstream .github directories.
          # Audit only this repository's executable GitHub configuration.
          inputs: .github
          advanced-security: false
          annotations: true
          version: "1.29.0"
          min-severity: informational

  release-tools:
    name: Release safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test receipt validation and release recovery
        run: python3 -m unittest discover -s .github/scripts/tests -v
