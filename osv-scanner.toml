#
# OSV-Scanner accepted vulnerabilities (the `osv-scanner` job of .github/workflows/secops.yml;
# .github/README-ycash.md "Security CI"). Every entry has a reason and an ignoreUntil at most 90 days
# out: on that date the finding fails the scan again and is re-triaged. Triaged 2026-11-01.
#
# Common to every entry: the fork's Cargo.lock is upstream zakura-core/common's at the base
# bdbca121628d (the fork adds only its own crates' version suffix and one dev-dependency edge,
# serde_json, already in the lock) and serves only the fork's own CI. kogany consumes the fork's
# crates through its own Cargo.lock, which resolves and scans its own versions: there ctutils is
# 0.4.6, rustls 0.23.46 and tokio 1.53.3 (past every fix below), and frost-core, minreq,
# quick-xml and ttf-parser are absent. A lock bump here comes with the next upstream sync or as
# its own reviewed commit. The cargo-deny leg's ignores (contrib/secops/deny-fork.toml) are the
# subset its default graph reaches, with the same reasons.

